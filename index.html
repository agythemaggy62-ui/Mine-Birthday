<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Internal</title>
  <style>
    html {
      background-color: #EFE4D2;
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }

    h1 {
      color: #131D4F;
      text-align: center;
    }

    h2 {
      text-align: center;
      color: #254D70;
    }

    img {
      display: block;
      margin: auto;
      width: 32%;
      border-radius: 15px;
    }

    h3 {
      color: #954C2E;
      text-align: center;
    }

    a {
      display: inline-block;
      width: 650px;
      text-align: center;
    }

    p {
      text-align: center;
    }

    button {
      background-color: violet;
      border-color: violet;
      padding: 15px;
      border-radius: 15px;
      display: block;
      width: 50%;
      text-align: center;
      font-family: 'Gill Sans MT', sans-serif;
      font-size: 20px;
      margin: 20px auto;
      cursor: pointer;
    }

    footer {
      text-align: center;
      margin-top: 30px;
    }
  </style>
</head>

<body>
  <h1>On the 19th October at 5:00 pm</h1>
  <h2>It is my Birthday Celebration!!</h2>

  <img src="./cake.png" alt="There is no blind person in my party so you are on the wrong website" />

  <h3>This is where you need to go</h3>
  <button onclick="taketomap()">Location Near My House</button>
  <p>*Note: Please phone me once you get to the location.*</p>

  <footer>
    © Copyright Agranya Ranade Ltd
  </footer>

  <script>
    function taketomap() {
      window.open("https://maps.app.goo.gl/yd397LUTa8sgYwxm8", "_blank");
    }
  </script>
</body>

</html>
